name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install audit tools (not added to requirements.txt)
        run: pip install pip-audit

      - name: Run backend test suite
        run: python -m pytest -q

      - name: Run pip-audit dependency vulnerability scan
        run: pip-audit -r requirements.txt

      - name: Run gitleaks secret detection
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend test suite
        run: npm run test:run

      - name: Run frontend build
        run: npm run build

      - name: Run npm audit dependency vulnerability scan
        run: npm audit

  docker:
    name: Validación de Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Valida la estructura del compose y que no faltan variables requeridas.
      # Los valores son dummies exclusivos de CI: nunca son credenciales reales.
      - name: Validar docker-compose.yml
        run: |
          POSTGRES_USER=ci POSTGRES_PASSWORD=ci POSTGRES_DB=ci \
          POSTGRES_HOST=db POSTGRES_PORT=5432 SECRET_KEY=ci \
          STAFF_PASSWORD=ci ADMIN_PASSWORD=ci \
          docker compose config --quiet

      - name: Construir imagen del backend
        run: docker build ./backend -f backend/Dockerfile -t hospitalpro/backend:ci

      - name: Construir imagen del frontend
        run: docker build ./frontend -f frontend/Dockerfile -t hospitalpro/frontend:ci
