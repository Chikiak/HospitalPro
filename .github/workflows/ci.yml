name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install audit tools (not added to requirements.txt)
        run: pip install ruff pip-audit

      - name: Run backend test suite
        run: python -m pytest -q

      - name: Run pip-audit dependency vulnerability scan
        run: pip-audit -r requirements.txt

      - name: Run gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend test suite
        run: npm run test:run

      - name: Run frontend build
        run: npm run build

      - name: Run npm audit dependency vulnerability scan
        run: npm audit

      - name: Run gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
